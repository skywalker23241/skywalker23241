<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
<title id="title">Abo profile footer</title>
<desc id="desc">A minimal dark footer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#090a0d"/>
    <stop offset=".5" stop-color="#111318"/>
    <stop offset="1" stop-color="#090a0d"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="96" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="96" fill="url(#bg)"/>
  <line x1="72" y1="24" x2="1128" y2="24" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="566" y="23" width="68" height="2" rx="1" fill="#e8b45f"/>
  <text x="600" y="61" text-anchor="middle" fill="#b3b7c0" font-family="Consolas,monospace" font-size="11" letter-spacing="2.4">BUILD · LEARN · OPTIMIZE · SHIP</text>
  <text x="72" y="63" fill="#565c68" font-family="Consolas,monospace" font-size="9" letter-spacing="1.8">ABO.UNIVERSE</text>
  <text x="1128" y="63" text-anchor="end" fill="#565c68" font-family="Consolas,monospace" font-size="9" letter-spacing="1.8">SIGNAL ONLINE</text>
</g>
</svg>