  <text x="550" y="216" fill="#9aa0ad" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="1.2">SEO Explorer · Web Builder · Independent Maker</text>
  <text x="550" y="260" fill="#e8b45f" font-family="Consolas,monospace" font-size="12" letter-spacing="2">● SIGNAL ONLINE   /   SHENZHEN, CN</text>
  <text x="78" y="330" fill="#565c68" font-family="Consolas,monospace" font-size="10" letter-spacing="2">EVENT HORIZON // BUILD · LEARN · OPTIMIZE · SHIP</text><text x="1125" y="330" text-anchor="end" fill="#565c68" font-family="Consolas,monospace" font-size="10" letter-spacing="2">BH-23241</text>
</g></svg>