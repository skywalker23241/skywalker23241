<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Abo Junbo Le profile banner</title>
<desc id="desc">A minimal dark profile banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#090a0d"/>
    <stop offset=".5" stop-color="#111318"/>
    <stop offset="1" stop-color="#090a0d"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="250" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="250" fill="url(#bg)"/>
  <line x1="72" y1="48" x2="1128" y2="48" stroke="#ffffff" stroke-opacity=".08"/>
  <line x1="72" y1="202" x2="1128" y2="202" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="86" cy="48" r="3" fill="#e8b45f"/>
  <text x="104" y="53" fill="#777d89" font-family="Consolas,monospace" font-size="11" letter-spacing="2">ABO.UNIVERSE</text>
  <text x="600" y="125" text-anchor="middle" fill="#f1f3f7" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="650" letter-spacing="-1">Abo / Junbo Le</text>
  <text x="600" y="164" text-anchor="middle" fill="#9aa0ad" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.4">SEO Explorer · Web Builder · Independent Maker</text>
  <text x="1118" y="53" text-anchor="end" fill="#777d89" font-family="Consolas,monospace" font-size="10" letter-spacing="2">SHENZHEN, CN</text>
  <rect x="548" y="201" width="104" height="2" rx="1" fill="#e8b45f"/>
</g>
</svg>